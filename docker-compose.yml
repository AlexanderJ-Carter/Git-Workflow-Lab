services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      # site/ 为站点根；docs/ 覆盖 /docs，提供课程 Markdown 与 viewer.html
      - ./site:/usr/share/nginx/html
      - ./docs:/usr/share/nginx/html/docs:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  gitea:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${GITEA_IMAGE:-git-workflow-lab-gitea:local}
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
      - GITEA__server__ROOT_URL=${PUBLIC_GITEA_URL:-http://localhost:3000/}
      - GITEA__server__DOMAIN=${GITEA_DOMAIN:-localhost}
      - GITEA__server__SSH_DOMAIN=${GITEA_SSH_DOMAIN:-localhost}
      - GITEA__server__SSH_PORT=${GITEA_SSH_PORT:-2222}
      - GITEA__server__START_SSH_SERVER=true
      - GITEA__server__DISABLE_SSH=false
      - GITEA__security__FRAME_ANCESTORS=${PUBLIC_DOCS_ORIGIN:-http://localhost:8081}
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=${GITEA_SECRET_KEY}
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-playground}
      - GITEA_ADMIN_PASSWORD=${GITEA_ADMIN_PASSWORD}
      - GITEA_ADMIN_EMAIL=${GITEA_ADMIN_EMAIL:-playground@example.com}
    volumes:
      - gitea-data:/data
    ports:
      - "3000:3000"
      - "2222:22"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  terminal:
    build:
      context: ./docker/terminal
      dockerfile: Dockerfile
    image: ${TERMINAL_IMAGE:-git-workflow-lab-terminal:local}
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - terminal-home:/home/playground
    environment:
      - TERM=xterm-256color
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=gitea
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=${GITEA_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  terminal-home:
  gitea-data:
  postgres-data:
