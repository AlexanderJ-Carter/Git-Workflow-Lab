<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="完成课程与测验解锁成就徽章。">
    <title>成就中心 - Git Workflow Lab</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* 成就页面样式 */
        .achievements-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Hero 区域 */
        .achievements-hero {
            padding: 80px 0 60px;
            text-align: center;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, var(--accent-glow), transparent),
                radial-gradient(circle at 20% 80%, rgba(139, 92, 246, 0.08), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.1), transparent 40%),
                var(--bg-secondary);
            position: relative;
        }

        .achievements-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%236366f1' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
            pointer-events: none;
        }

        .achievements-hero h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-primary) 50%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .achievements-hero p {
            font-size: 18px;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* 进度概览 */
        .progress-overview {
            max-width: 800px;
            margin: 0 auto 48px;
            padding: 0 24px;
        }

        .progress-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow-card);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .progress-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .progress-stats {
            display: flex;
            gap: 24px;
        }

        .progress-stat {
            text-align: center;
        }

        .progress-stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-primary);
            font-family: 'JetBrains Mono', monospace;
        }

        .progress-stat-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .progress-bar-container {
            position: relative;
            height: 12px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: var(--radius-full);
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.2) 50%, transparent 100%);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-percentage {
            position: absolute;
            right: 0;
            top: -24px;
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-primary);
        }

        /* 成就网格 */
        .achievements-grid-section {
            padding: 0 0 80px;
            flex: 1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        /* 成就卡片 */
        .achievement-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: default;
        }

        .achievement-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .achievement-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .achievement-card:hover::before {
            opacity: 1;
        }

        .achievement-card.unlocked {
            background: var(--bg-primary);
            border-color: var(--accent-primary);
        }

        .achievement-card.unlocked::before {
            opacity: 1;
        }

        .achievement-card.locked {
            opacity: 0.6;
        }

        .achievement-card.locked .achievement-icon {
            filter: grayscale(1);
            opacity: 0.4;
        }

        /* 成就图标 */
        .achievement-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            background: var(--accent-light);
            border-radius: 50%;
            transition: all 0.3s;
            position: relative;
        }

        .achievement-card.unlocked .achievement-icon {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3); }
            50% { box-shadow: 0 4px 30px rgba(99, 102, 241, 0.5); }
        }

        /* 成就信息 */
        .achievement-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .achievement-card.locked .achievement-name {
            color: var(--text-muted);
        }

        .achievement-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .achievement-requirement {
            font-size: 12px;
            color: var(--text-muted);
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            display: inline-block;
        }

        /* 成就解锁状态 */
        .achievement-status {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .achievement-date {
            font-size: 12px;
            color: var(--success);
            font-weight: 500;
        }

        .achievement-card.locked .achievement-status {
            display: none;
        }

        /* 悬停详情提示 */
        .achievement-tooltip {
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            width: 220px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
            z-index: 10;
            text-align: left;
        }

        .achievement-card:hover .achievement-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale(1);
        }

        .achievement-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 8px solid transparent;
            border-top-color: var(--bg-primary);
        }

        .tooltip-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .tooltip-text {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 24px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 16px;
        }

        /* 页脚 */
        .achievements-footer {
            padding: 32px 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .achievements-hero h1 {
                font-size: 32px;
            }

            .achievements-hero p {
                font-size: 16px;
            }

            .progress-stats {
                gap: 16px;
            }

            .progress-stat-value {
                font-size: 24px;
            }

            .achievements-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        <!-- 进度概览 -->

    <script src="assets/js/main.js" defer></script>
    <script>
        // 成就定义
        const ACHIEVEMENTS = [
            {
                id: 'first-lesson',
                name: '入门新手',
                desc: '完成第一课',
                icon: '🌟',
                requirement: '完成 1 节课',
                condition: (_progress, stats) => stats.completedLessons >= 1,
                tooltip: '恭喜你完成了第一课！这是学习 Git 的第一步，继续加油！'
            },
            {
                id: 'stage-0-1',
                name: '基础掌握',
                desc: '完成阶段 0-1',
                icon: '📚',
                requirement: '完成阶段 A-B 全部课程',
                condition: (_progress, stats) => stats.stageCompleted[0] === true,
                tooltip: '你已掌握 Git 基础！包括安装配置、仓库创建、提交和远程同步。'
            },
            {
                id: 'stage-2',
                name: '分支达人',
                desc: '完成阶段 2',
                icon: '🌿',
                requirement: '完成阶段 C 全部课程',
                condition: (_progress, stats) => stats.stageCompleted[1] === true,
                tooltip: '分支协作高手！你已经学会分支、PR、冲突解决和 rebase。'
            },
            {
                id: 'stage-3',
                name: '救火队长',
                desc: '完成阶段 3',
                icon: '🚒',
                requirement: '完成阶段 D 全部课程',
                condition: (_progress, stats) => stats.stageCompleted[2] === true,
                tooltip: '故障恢复专家！你掌握了 cherry-pick、revert、reflog 和 stash。'
            },
            {
                id: 'stage-4-5',
                name: 'CI/CD 工程师',
                desc: '完成阶段 4-5',
                icon: '⚡',
                requirement: '完成阶段 E 与 F 全部课程',
                condition: (_progress, stats) =>
                    stats.stageCompleted[4] === true && stats.stageCompleted[5] === true,
                tooltip: '自动化大师！你已掌握 CI/CD 流水线、Secrets 和自动发布。'
            },
            {
                id: 'all-complete',
                name: '全勤奖',
                desc: '完成所有课程',
                icon: '🏆',
                requirement: '完成全部课程',
                condition: (_progress, stats) => stats.completedLessons >= stats.totalLessons && stats.totalLessons > 0,
                tooltip: '太棒了！你已完成所有课程，成为 Git 和 CI/CD 全栈工程师！'
            },
            {
                id: 'command-master',
                name: '测验达人',
                desc: '通过 15 场课程测验',
                icon: '⌨️',
                requirement: '通过 15 场测验',
                condition: (_progress, stats) => stats.passedQuizzes >= 15,
                tooltip: '你已经通过足够多的测验，核心命令与工作流掌握扎实。'
            },
            {
                id: 'streak-7',
                name: '连续学习',
                desc: '连续学习 7 天',
                icon: '🔥',
                requirement: '连续学习 7 天',
                condition: (_progress, stats) => stats.streakDays >= 7,
                tooltip: '坚持就是胜利！你已经连续学习 7 天了，保持这个好习惯！'
            },
            {
                id: 'quiz-starter',
                name: '测验初体验',
                desc: '通过第一场测验',
                icon: '📝',
                requirement: '通过 1 场测验',
                condition: (_progress, stats) => stats.passedQuizzes >= 1,
                tooltip: '不错！你已经开始用测验检验学习成果了。'
            },
            {
                id: 'challenge-rookie',
                name: '挑战新手',
                desc: '完成一个场景挑战',
                icon: '⚔️',
                requirement: '完成 1 个挑战',
                condition: (_progress, stats) => stats.completedChallenges >= 1,
                tooltip: '实战开局！继续挑战更难的场景吧。'
            },
            {
                id: 'flashcard-learner',
                name: '闪卡学习者',
                desc: '掌握 5 张闪卡',
                icon: '🧠',
                requirement: '掌握 5 张闪卡',
                condition: (_progress, stats) => stats.flashcardsMastered >= 5,
                tooltip: '间隔重复正在生效，继续巩固命令记忆！'
            }
        ];

        const AchievementStore = {
            ACHIEVEMENTS_KEY: 'git-workflow-lab-achievements',

            getAchievements() {
                try {
                    const data = localStorage.getItem(this.ACHIEVEMENTS_KEY);
                    return data ? JSON.parse(data) : {};
                } catch {
                    return {};
                }
            },

            saveAchievement(achievementId, unlocked) {
                const achievements = this.getAchievements();
                achievements[achievementId] = {
                    unlocked,
                    unlockedAt: unlocked ? Date.now() : null
                };
                localStorage.setItem(this.ACHIEVEMENTS_KEY, JSON.stringify(achievements));
            },

            buildStageCompleted(lessons, progress) {
                const byStage = new Map();
                lessons.forEach((lesson) => {
                    const stage = lesson.stage ?? 0;
                    if (!byStage.has(stage)) byStage.set(stage, []);
                    byStage.get(stage).push(lesson.id);
                });
                const stageCompleted = {};
                byStage.forEach((ids, stage) => {
                    stageCompleted[stage] = ids.every((id) => progress[id]?.completed);
                });
                return stageCompleted;
            },

            getStats(lessons) {
                const progress = window.GitWorkflowLab?.LearningProgress?.getProgress?.() || {};
                const snapshot = window.GitWorkflowLab?.ActivityProgress?.getSnapshot?.() || {
                    completedLessons: 0,
                    passedQuizzes: 0,
                    completedChallenges: 0,
                    flashcardsMastered: 0,
                    streakDays: 0
                };
                const lessonIds = lessons.map((l) => l.id);
                const completedLessons = lessonIds.filter((id) => progress[id]?.completed).length;

                return {
                    completedLessons,
                    totalLessons: lessons.length,
                    streakDays: snapshot.streakDays || 0,
                    passedQuizzes: snapshot.passedQuizzes || 0,
                    completedChallenges: snapshot.completedChallenges || 0,
                    flashcardsMastered: snapshot.flashcardsMastered || 0,
                    stageCompleted: this.buildStageCompleted(lessons, progress)
                };
            }
        };

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}年${month}月${day}日`;
        }

        let CATALOG_LESSONS = [];

        function renderAchievements() {
            const grid = document.getElementById('achievements-grid');
            if (!grid || CATALOG_LESSONS.length === 0) return;

            const progress = window.GitWorkflowLab?.LearningProgress?.getProgress?.() || {};
            const savedAchievements = AchievementStore.getAchievements();
            const stats = AchievementStore.getStats(CATALOG_LESSONS);

            ACHIEVEMENTS.forEach((achievement) => {
                const isUnlocked = achievement.condition(progress, stats);
                if (isUnlocked !== savedAchievements[achievement.id]?.unlocked) {
                    AchievementStore.saveAchievement(achievement.id, isUnlocked);
                    savedAchievements[achievement.id] = {
                        unlocked: isUnlocked,
                        unlockedAt: isUnlocked ? Date.now() : null
                    };
                }
            });

            const achievements = AchievementStore.getAchievements();

            grid.innerHTML = ACHIEVEMENTS.map((achievement) => {
                const achievementData = achievements[achievement.id] || {};
                const isUnlocked = achievementData.unlocked;
                const unlockedAt = achievementData.unlockedAt;

                return `
                    <div class="achievement-card ${isUnlocked ? 'unlocked' : 'locked'}">
                        <div class="achievement-icon">${achievement.icon}</div>
                        <div class="achievement-name">${achievement.name}</div>
                        <div class="achievement-desc">${achievement.desc}</div>
                        <div class="achievement-requirement">${achievement.requirement}</div>
                        ${isUnlocked ? `
                            <div class="achievement-status">
                                <span class="achievement-date">解锁于 ${formatDate(unlockedAt)}</span>
                            </div>
                        ` : ''}
                        <div class="achievement-tooltip">
                            <div class="tooltip-title">${achievement.name}</div>
                            <div class="tooltip-text">${achievement.tooltip}</div>
                        </div>
                    </div>
                `;
            }).join('');

            updateProgressDisplay(stats);
        }

        function updateProgressDisplay(learningStats) {
            const savedAchievements = AchievementStore.getAchievements();
            const unlockedCount = Object.values(savedAchievements).filter((a) => a.unlocked).length;
            const totalCount = ACHIEVEMENTS.length;
            const percentage = Math.round((unlockedCount / totalCount) * 100);
            const quizStats = window.GitWorkflowLab?.QuizProgress?.getStats?.() || {
                passedCount: 0,
                totalCount: 0
            };

            document.getElementById('unlocked-count').textContent = unlockedCount;
            document.getElementById('completed-lessons-count').textContent =
                `${learningStats.completedLessons}/${learningStats.totalLessons}`;
            document.getElementById('passed-quiz-count').textContent =
                `${quizStats.passedCount}/${quizStats.totalCount}`;
            document.getElementById('progress-fill').style.width = `${percentage}%`;
            document.getElementById('progress-percent').textContent = `${percentage}%`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const catalog = await window.GitWorkflowLab.LessonCatalog.load();
                CATALOG_LESSONS = catalog.filter((lesson) => String(lesson.id).startsWith('lesson-'));
            } catch (error) {
                console.error('[achievements] catalog load failed', error);
                CATALOG_LESSONS = [];
            }
            renderAchievements();
            window.addEventListener('storage', renderAchievements);
            window.addEventListener('git-workflow-lab:progress', renderAchievements);
        });
    </script>
</body>
</html>
