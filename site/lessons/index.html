<!DOCTYPE html>

    <meta name="description" content="系统化 Git 与 CI/CD 课程目录，含进度追踪。">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="page lessons-page">
    <main class="page-main">
        <header class="page-hero">
            <h1>课程中心</h1>

            <div class="stats-bar" style="margin-bottom: 0;">

            </div>
        </header>

        <div class="lessons-toolbar">
            <div class="lessons-progress">
                <span>学习进度</span>

                <div class="lessons-progress-bar" aria-hidden="true">
                    <div class="lessons-progress-fill" id="progress-fill" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <section class="stage-block" id="stage-0">
            <div class="stage-block__head">
                <span class="stage-badge">阶段 A-B</span>

                <span class="stage-block__meta" data-stage-meta="0"></span>
            </div>
            <div class="lesson-grid"></div>
        </section>

        <section class="stage-block" id="stage-1">
            <div class="stage-block__head">
                <span class="stage-badge">阶段 C</span>
                <h2>协作</h2>
                <span class="stage-block__meta" data-stage-meta="1"></span>
            </div>
            <div class="lesson-grid"></div>
        </section>

        <section class="stage-block" id="stage-2">
            <div class="stage-block__head">
                <span class="stage-badge">阶段 D</span>
                <h2>恢复</h2>
                <span class="stage-block__meta" data-stage-meta="2"></span>
            </div>
            <div class="lesson-grid"></div>
        </section>

        <section class="stage-block" id="stage-3">
            <div class="stage-block__head">
                <span class="stage-badge">阶段 E</span>
                <h2>工程</h2>
                <span class="stage-block__meta" data-stage-meta="3"></span>
            </div>
            <div class="lesson-grid"></div>
        </section>

        <section class="stage-block" id="stage-4">
            <div class="stage-block__head">
                <span class="stage-badge">阶段 F</span>
                <h2>CI/CD</h2>
                <span class="stage-block__meta" data-stage-meta="4"></span>
            </div>
            <div class="lesson-grid"></div>
        </section>

        <section class="stage-block" id="stage-5">
            <div class="stage-block__head">
                <span class="stage-badge">阶段 G</span>
                <h2>安全</h2>
                <span class="stage-block__meta" data-stage-meta="5"></span>
            </div>
            <div class="lesson-grid"></div>
        </section>

        <section class="stage-block" id="stage-6">
            <div class="stage-block__head">
                <span class="stage-badge">阶段 H</span>
                <h2>进阶</h2>
                <span class="stage-block__meta" data-stage-meta="6"></span>
            </div>
            <div class="lesson-grid"></div>
        </section>

        <section class="stage-block" id="stage-7">
            <div class="stage-block__head">
                <span class="stage-badge">阶段 I</span>
                <h2>计算机基础</h2>
                <span class="stage-block__meta" data-stage-meta="7"></span>
            </div>
            <div class="lesson-grid"></div>
        </section>

        <section class="stage-block" id="stage-8">
            <div class="stage-block__head">
                <span class="stage-badge">阶段 J</span>
                <h2>编程与跨平台 CLI</h2>
                <span class="stage-block__meta" data-stage-meta="8"></span>
            </div>
            <div class="lesson-grid"></div>

        <section class="stage-block" id="stage-9">
            <div class="stage-block__head">
                <span class="stage-badge">阶段 K</span>
                <h2>配置与文本处理</h2>
                <span class="stage-block__meta" data-stage-meta="9"></span>
            </div>
            <div class="lesson-grid"></div>

        <div class="lessons-quick">
            <a href="../docs/viewer.html?file=learning-modes.md">双模式指南</a>
            <a href="../docs/viewer.html?file=lessons-overview.md">课程总览</a>
            <a href="../docs/viewer.html?file=learning-path.md">学习路径</a>
            <a href="../workspace.html">进入工作台</a>
        </div>

    <footer class="page-footer">
        <p>Git Workflow Lab · MIT License · <a href="https://github.com/AlexanderJ-Carter/Git-Workflow-Lab">GitHub</a></p>
    </footer>

    <script src="../assets/js/main.js" defer></script>
    <script>
        const STAGE_IDS = ['stage-0', 'stage-1', 'stage-2', 'stage-3', 'stage-4', 'stage-5', 'stage-6', 'stage-7', 'stage-8', 'stage-9'];

        const progressApi = () => window.GitWorkflowLab?.LearningProgress;

        function escapeHtml(text) {
            const el = document.createElement('span');
            el.textContent = text ?? '';
            return el.innerHTML;
        }

        function formatModes(modes) {
            if (!Array.isArray(modes) || modes.length === 0) {
                return '<span class="lesson-mode lesson-mode--both" title="在线可读，本地可练">🌐+🐳</span>';
            }
            const online = modes.includes('online');
            const local = modes.includes('local');
            if (online && local) {
                return '<span class="lesson-mode lesson-mode--both" title="在线可读，本地可练">🌐+🐳</span>';
            }
            if (local) {
                return '<span class="lesson-mode lesson-mode--local" title="建议本地 Docker 实验">🐳</span>';
            }
            return '<span class="lesson-mode lesson-mode--online" title="在线可学">🌐</span>';
        }

        function estimateTime(lesson) {
            const match = lesson.desc?.match(/(\d+)\s*分钟/);
            if (match) return `${match[1]}分钟`;
            return '30分钟';
        }

        function isCompleted(lessonId) {
            return progressApi()?.isCompleted?.(lessonId) ?? false;
        }

        function getCompletedCount() {
            return progressApi()?.getCompletedCount?.() ?? 0;
        }

        function renderLessonCard(lesson) {
            const completed = isCompleted(lesson.id);
            const completedClass = completed ? ' completed' : '';
            const badge = lesson.badge || lesson.id.replace('lesson-', '');
            const time = estimateTime(lesson);
            const href = `../docs/viewer.html?file=${encodeURIComponent(lesson.file)}`;
            return `
                <a href="${href}" class="lesson-card${completedClass}" data-lesson-id="${escapeHtml(lesson.id)}">
                    <div class="lesson-card__top">
                        <span class="lesson-card__id">${escapeHtml(badge)} ${formatModes(lesson.modes)}</span>
                        <span class="lesson-card__time">${escapeHtml(time)}</span>
                    </div>
                    <h3>${escapeHtml(lesson.title)}</h3>
                    <p>${escapeHtml(lesson.desc)}</p>
                </a>
            `;
        }

        function renderLessons(lessons) {
            STAGE_IDS.forEach((stageId, stageIndex) => {
                const section = document.getElementById(stageId);
                const container = section?.querySelector('.lesson-grid');
                if (!container) return;

                const stageLessons = lessons.filter((lesson) => lesson.stage === stageIndex);
                container.innerHTML = stageLessons.map(renderLessonCard).join('');

                const meta = document.querySelector(`[data-stage-meta="${stageIndex}"]`);
                if (meta) {
                    meta.textContent = `${stageLessons.length} 个关卡`;
                }
            });
        }

        function updateProgress(total) {
            const completed = getCompletedCount();
            const percentage = total ? Math.round((completed / total) * 100) : 0;

            const valueEl = document.getElementById('progress-value');
            const fillEl = document.getElementById('progress-fill');
            if (valueEl) valueEl.textContent = `${percentage}%`;
            if (fillEl) fillEl.style.width = `${percentage}%`;
        }

        let cachedLessons = [];

        function refresh() {
            renderLessons(cachedLessons);
            updateProgress(cachedLessons.length);
        }

        async function initLessonsPage() {
            try {
                const response = await fetch('../assets/data/lessons.json');
                if (!response.ok) throw new Error('Failed to load lessons.json');
                const data = await response.json();
                cachedLessons = data.filter((item) => item.id.startsWith('lesson-'));
                refresh();
            } catch (error) {
                console.error('[lessons]', error);
            }

            window.addEventListener('storage', refresh);
        }

        document.addEventListener('DOMContentLoaded', initLessonsPage);
    </script>
</body>
</html>
